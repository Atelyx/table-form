[package]
name = "table-form"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 表格表单插件：把多维表格的一行渲染成可填写的表单，逐格写回同一份表格数据"

# 独立 crate，不作为宿主 workspace 成员；[workspace] 空表声明自身为 workspace 根，
# 避免 cargo 向上探测误并入其他 workspace。
[workspace]

[[bin]]
name = "table-form"
path = "src/main.rs"

[dependencies]
atelyx-plugin-sdk = { path = "../../Atelyx/atelyx-plugin-sdk" }
# run_stdio 的 #[tokio::main] 运行时、回调内共享状态用的异步互斥锁、输入停顿合并用的定时器
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TableProvider 接缝用 async fn in trait，需 async-trait 保证 dyn 兼容（对象安全）
async-trait = "0.1"
